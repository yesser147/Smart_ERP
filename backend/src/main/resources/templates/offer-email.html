<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Offre d'emploi</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f7; margin: 0; padding: 24px;">
    <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
        <h2 style="color: #1e293b;">Félicitations !</h2>
        <p style="color: #334155; font-size: 15px; line-height: 1.6;">
            Bonjour <span th:text="${applicantName}">Candidat</span>,
        </p>
        <p style="color: #334155; font-size: 15px; line-height: 1.6;">
            Nous avons le plaisir de vous informer que nous souhaitons vous proposer le
            poste de <strong th:text="${jobTitle}">Poste</strong> au sein de notre entreprise.
        </p>
        <p style="color: #334155; font-size: 15px; line-height: 1.6;">
            Notre équipe RH vous contactera très prochainement avec les détails de
            l'offre et les prochaines étapes.
        </p>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 32px;">
            — L'équipe Recrutement, Nexus ERP
        </p>
    </div>
</body>
</html>
