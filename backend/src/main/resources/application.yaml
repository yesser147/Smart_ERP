server:
  port: 8080
  servlet:
    context-path: /api/v1 

spring:
  application:
    name: smart-erp-core

  # Database Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_erp
    username: postgres
    password: postgres  
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"

