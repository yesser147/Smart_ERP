version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smart_erp_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_erp
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    
  # Optional but highly recommended: pgAdmin for a visual database interface
  pgadmin:
    image: dpage/pgadmin4
    container_name: smart_erp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: saidaniyesser999@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  erp_postgres_data: