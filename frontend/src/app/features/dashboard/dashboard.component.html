<div class="min-h-screen bg-slate-900 text-white p-8">
  
  <!-- HEADER -->
  <header class="flex justify-between items-center pb-6 border-b border-slate-800">
    <div>
      <h1 class="text-2xl font-bold">Smart ERP - Tableau de Bord</h1>
      <p class="text-sm text-slate-400">
        Connecté en tant que: <span class="text-teal-400 font-medium">{{ userInfo?.email }}</span> 
        ({{ userInfo?.role }})
      </p>
    </div>
    <div class="flex gap-4">
     
      <a
        routerLink="/dashboard/register" 
        class="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-lg text-sm font-medium transition-colors flex items-center cursor-pointer"
      >
        + Créer un utilisateur
      </a>
      <!-- LOGOUT BUTTON -->
      <button
        (click)="logout()"
        class="px-4 py-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 rounded-lg text-sm font-medium transition-colors"
      >
        Déconnexion
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="mt-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h3 class="text-slate-400 text-sm font-medium">Effectif Total</h3>
        <p class="text-3xl font-bold mt-2">--</p>
      </div>
      
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h3 class="text-slate-400 text-sm font-medium">Demandes de Congé</h3>
        <p class="text-3xl font-bold mt-2">--</p>
      </div>
      
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h3 class="text-slate-400 text-sm font-medium">Candidats ATS</h3>
        <p class="text-3xl font-bold mt-2">--</p>
      </div>

    </div>
  </main>

</div>
