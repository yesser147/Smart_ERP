<div class="space-y-6">
  <div>
    <div class="erp-title-row">
      <svg class="erp-page-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z" />
      </svg>
      <h2 class="erp-page-title">Compensation & Performance</h2>
    </div>
    <p class="text-sm text-slate-400 mt-1">Salaries, training, pay gaps, and engagement</p>
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
    <div class="erp-card p-6">
      <h4 class="erp-section-title mb-4">Average salary by unit</h4>
      <apx-chart *ngIf="salaryChart"
        [series]="salaryChart.series" [chart]="salaryChart.chart"
        [xaxis]="salaryChart.xaxis" [plotOptions]="salaryChart.plotOptions"
        [colors]="salaryChart.colors" [fill]="salaryChart.fill" [tooltip]="salaryChart.tooltip">
      </apx-chart>
    </div>

    <div class="erp-card p-6">
      <h4 class="erp-section-title mb-4">Training investment by department type</h4>
      <apx-chart *ngIf="trainingChart"
        [series]="trainingChart.series" [chart]="trainingChart.chart"
        [xaxis]="trainingChart.xaxis" [plotOptions]="trainingChart.plotOptions"
        [colors]="trainingChart.colors" [tooltip]="trainingChart.tooltip">
      </apx-chart>
    </div>
  </div>

  <!-- NEW: Gender Pay Gap -->
  <div class="erp-card p-6">
    <h4 class="erp-section-title mb-4">Pay gap by gender and unit</h4>
    <apx-chart *ngIf="payGapChart"
      [series]="payGapChart.series" [chart]="payGapChart.chart"
      [xaxis]="payGapChart.xaxis" [plotOptions]="payGapChart.plotOptions"
      [colors]="payGapChart.colors" [fill]="payGapChart.fill"
      [grid]="payGapChart.grid" [tooltip]="payGapChart.tooltip" [legend]="payGapChart.legend">
    </apx-chart>
  </div>

  <div class="erp-card p-6">
    <h4 class="erp-section-title mb-4">Performance vs engagement (all roles)</h4>
    <div class="w-full overflow-x-auto">
      <apx-chart *ngIf="performanceChart"
        [series]="performanceChart.series" [chart]="performanceChart.chart"
        [xaxis]="performanceChart.xaxis" [yaxis]="performanceChart.yaxis"
        [stroke]="performanceChart.stroke" [colors]="performanceChart.colors"
        [tooltip]="performanceChart.tooltip">
      </apx-chart>
    </div>
  </div>
</div>
