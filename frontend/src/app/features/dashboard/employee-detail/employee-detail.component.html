<!-- employee-detail.component.html -->
<div class="max-w-2xl mx-auto p-6">
  <div *ngIf="loading" class="text-slate-400">Chargement...</div>
  <div *ngIf="error" class="text-rose-400">Employé introuvable.</div>
  <div *ngIf="employee as e" class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-3">
    <h2 class="text-xl font-semibold text-white">{{ e.firstName }} {{ e.lastName }}</h2>
    <div class="grid grid-cols-2 gap-3 text-sm">
      <div><span class="text-slate-400">Titre : </span><span class="text-white">{{ e.title }}</span></div>
      <div><span class="text-slate-400">Statut : </span><span class="text-white">{{ e.employeeStatus }}</span></div>
      <div><span class="text-slate-400">Salaire : </span><span class="text-white">${{ e.salary | number:'1.0-0' }}</span></div>
      <div><span class="text-slate-400">Fonction : </span><span class="text-white">{{ e.jobFunction }}</span></div>
    </div>
  </div>
</div>
