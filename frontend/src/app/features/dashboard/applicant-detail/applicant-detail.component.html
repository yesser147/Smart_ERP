<div class="erp-card p-6 space-y-3">
  <h3 class="erp-section-title">Discuter de la compatibilité avec l'IA</h3>
  <div class="flex gap-3">
    <select [(ngModel)]="selectedJobId" (ngModelChange)="onJobSelected()" class="erp-input flex-1">
      <option [ngValue]="null" disabled>Sélectionner un poste...</option>
      <option *ngFor="let job of jobPostings" [ngValue]="job.jobId">{{ job.title }}</option>
    </select>
    <button *ngIf="selectedJobId !== null" (click)="resetChat()" class="erp-btn-secondary px-3 text-xs">
      Réinitialiser
    </button>
  </div>

  <div *ngIf="selectedJobId !== null" class="space-y-3">
    <div class="max-h-80 overflow-y-auto space-y-2 pr-1">
      <div *ngFor="let m of chatMessages"
           [ngClass]="m.role === 'user' ? 'ml-auto bg-violet-500/10 border-violet-500/20 text-right' : 'mr-auto bg-slate-900/60 border-slate-700'"
           class="max-w-[85%] p-3 rounded-lg border text-sm text-slate-200">
        {{ m.content }}
      </div>
      <div *ngIf="chatMessages.length === 0" class="text-xs text-slate-500 text-center py-4">
        Posez une question, par exemple : "Ce candidat a-t-il l'expérience nécessaire pour ce poste ?"
      </div>
    </div>

    <div *ngIf="chatError" class="erp-alert-error text-xs">{{ chatError }}</div>

    <div class="flex gap-2">
      <input [(ngModel)]="chatInput" (keyup.enter)="sendChatMessage()" placeholder="Posez une question sur ce candidat..."
             class="erp-input flex-1" [disabled]="chatSending" />
      <button (click)="sendChatMessage()" [disabled]="chatSending || !chatInput.trim()" class="erp-btn-primary px-4">
        {{ chatSending ? '...' : 'Envoyer' }}
      </button>
    </div>
  </div>
</div>
