<div class="max-w-xl mx-auto p-6">
  <h2 class="text-xl font-semibold text-white mb-6">Postuler à une offre</h2>

  <form [formGroup]="applicationForm" (ngSubmit)="onSubmit()" class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-xs text-slate-400 block mb-1">Prénom</label>
        <input formControlName="firstName" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white" />
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1">Nom</label>
        <input formControlName="lastName" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white" />
      </div>
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Email</label>
      <input type="email" formControlName="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white" />
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Téléphone</label>
      <input formControlName="phoneNumber" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white" />
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Niveau d'études</label>
      <input formControlName="educationLevel" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white" />
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Poste</label>
      <select formControlName="jobId" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
        <option [ngValue]="null" disabled>Sélectionner un poste...</option>
        <option *ngFor="let job of jobPostings" [ngValue]="job.jobId">
          {{ job.title }} — {{ job.departmentName || 'Département #' + job.departmentId }}
        </option>
      </select>
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Salaire souhaité ($)</label>
      <input type="number" formControlName="desiredSalary" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white" />
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">CV (PDF)</label>
      <input type="file" accept="application/pdf" (change)="onFileSelected($event)"
             class="w-full text-slate-300 text-sm" />
    </div>

    <p *ngIf="errorMessage" class="text-rose-400 text-sm">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="text-teal-400 text-sm">{{ successMessage }}</p>

    <button type="submit" [disabled]="isSubmitting"
            class="w-full py-2.5 bg-violet-500 hover:bg-violet-400 disabled:opacity-50 text-slate-900 font-semibold rounded-lg transition-colors">
      {{ isSubmitting ? 'Envoi en cours...' : 'Envoyer ma candidature' }}
    </button>
  </form>
</div>
