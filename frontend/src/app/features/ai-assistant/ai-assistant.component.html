<!-- Floating Action Button -->
<button 
  (click)="toggleAssistant()"
  class="fixed bottom-6 right-6 z-50 p-4 rounded-full bg-teal-500 hover:bg-teal-400 text-white shadow-lg shadow-teal-500/30 transition-transform hover:scale-110 flex items-center justify-center">
  <!-- Sparkles/Robot Icon -->
  <svg *ngIf="!isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
  </svg>
  <!-- Close Icon -->
  <svg *ngIf="isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
  </svg>
</button>

<!-- Slide-up Chat Panel -->
<div *ngIf="isOpen" 
  class="fixed bottom-24 right-6 z-50 w-[400px] h-[600px] bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-fade-in-up">
  
  <!-- Header -->
  <div class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
    <div>
      <h3 class="text-white font-semibold flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
        SmartERP AI
      </h3>
      <p class="text-xs text-slate-400">Assistant RH & Stratégie</p>
    </div>
  </div>

  <!-- Messages Container -->
  <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
    <div *ngFor="let msg of messages" 
         [ngClass]="msg.sender === 'user' ? 'flex justify-end' : 'flex justify-start'">
      
      <div [ngClass]="msg.sender === 'user' ? 'bg-teal-500/20 text-teal-100 border-teal-500/30' : 'bg-slate-800 text-slate-300 border-slate-700'"
           class="max-w-[85%] rounded-xl p-3 border text-sm shadow-sm">
        
        <!-- Text -->
        <p class="whitespace-pre-wrap">{{ msg.text }}</p>
        
        <!-- Optional Tabular Data Preview -->
    <!-- Optional Tabular Data Preview -->
<div *ngIf="msg.data && msg.data.length > 0" class="mt-3 overflow-x-auto rounded border border-slate-600 bg-slate-900/50">
  <table class="w-full text-left text-xs">
    <thead class="text-slate-400 border-b border-slate-600">
      <tr>
        <th *ngFor="let key of getKeys(msg.data[0])" class="p-2">{{ key }}</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-700">
      <tr *ngFor="let row of msg.data | slice:0:3">
        <td *ngFor="let key of getKeys(row)" class="p-2 truncate max-w-[100px]">{{ row[key] }}</td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="msg.data.length > 3" class="text-[10px] text-center text-slate-400 p-1 bg-slate-800">
    + {{ msg.data.length - 3 }} autres lignes
  </p>
</div>

      </div>
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isLoading" class="flex justify-start">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex gap-2">
        <div class="w-2 h-2 bg-slate-500 rounded-full animate-bounce"></div>
        <div class="w-2 h-2 bg-slate-500 rounded-full animate-bounce delay-100"></div>
        <div class="w-2 h-2 bg-slate-500 rounded-full animate-bounce delay-200"></div>
      </div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="p-2 bg-slate-800 border-t border-slate-700 flex gap-2 overflow-x-auto no-scrollbar">
    <button (click)="runBudgetAdvisor()" class="whitespace-nowrap px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs text-sky-400 rounded-lg transition-colors border border-slate-600">
      💰 Optimiser Budget
    </button>
    <button (click)="runRetentionAnalysis()" class="whitespace-nowrap px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs text-rose-400 rounded-lg transition-colors border border-slate-600">
      🛡️ Analyser Rétention
    </button>
  </div>

  <!-- Input Area -->
  <div class="p-3 bg-slate-900 border-t border-slate-700">
    <form (ngSubmit)="sendMessage()" class="flex gap-2">
      <input 
        type="text" 
        [(ngModel)]="userInput" 
        name="prompt"
        placeholder="Posez une question en langage naturel..." 
        class="flex-1 bg-slate-800 text-slate-200 text-sm rounded-lg px-4 py-2 border border-slate-600 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all">
      <button 
        type="submit"
        [disabled]="isLoading || !userInput.trim()"
        class="bg-teal-500 hover:bg-teal-400 text-white rounded-lg p-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </form>
  </div>
</div>
