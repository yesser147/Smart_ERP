<div class="erp-page min-h-screen py-10 px-4">
  <div class="max-w-xl mx-auto erp-card p-8">
  <div class="mb-6">
    <h2 class="erp-page-title text-2xl">Create a new user</h2>
    <p class="text-sm text-slate-400 mt-1">Add a new account and assign a system role.</p>
  </div>

  @if (successMessage()) {
    <div class="mb-4 bg-accent-muted border border-accent/40 text-accent p-3 rounded-lg text-sm">
      {{ successMessage() }}
    </div>
  }

  @if (errorMessage()) {
    <div class="mb-4 erp-alert-error">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-slate-300">Email address</label>
      <input
        type="email"
        formControlName="email"
        class="erp-input mt-1 py-2.5"
      />
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-medium text-slate-300">Temporary password</label>
      <input
        type="password"
        formControlName="password"
        class="erp-input mt-1 py-2.5"
      />
    </div>

    <!-- Role Selection Dropdown -->
    <div>
      <label class="block text-sm font-medium text-slate-300">Assigned role</label>
      <select
        formControlName="role"
        class="erp-input mt-1 py-2.5"
      >
        @for (r of roles; track r.value) {
          <option [value]="r.value">{{ r.label }} ({{ r.value }})</option>
        }
      </select>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading()"
      class="erp-btn-primary w-full mt-4 py-3"
    >
      @if (isLoading()) {
        <span>Creating...</span>
      } @else {
        <span>Create user</span>
      }
    </button>
  </form>
  </div>
</div>
