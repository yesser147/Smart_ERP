<div class="max-w-xl mx-auto my-10 bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-xl">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-white">Créer un nouvel utilisateur</h2>
    <p class="text-sm text-slate-400">Ajouter un nouveau compte et lui attribuer un rôle système.</p>
  </div>

  @if (successMessage()) {
    <div class="mb-4 bg-teal-500/10 border border-teal-500/50 text-teal-400 p-3 rounded-lg text-sm">
      {{ successMessage() }}
    </div>
  }

  @if (errorMessage()) {
    <div class="mb-4 bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
    
    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-slate-300">Adresse Email</label>
      <input
        type="email"
        formControlName="email"
        class="mt-1 block w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500"
      />
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-medium text-slate-300">Mot de passe temporaire</label>
      <input
        type="password"
        formControlName="password"
        class="mt-1 block w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-teal-500"
      />
    </div>

    <!-- Role Selection Dropdown -->
    <div>
      <label class="block text-sm font-medium text-slate-300">Rôle Attribué</label>
      <select
        formControlName="role"
        class="mt-1 block w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-teal-500"
      >
        @for (r of roles; track r.value) {
          <option [value]="r.value">{{ r.label }} ({{ r.value }})</option>
        }
      </select>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading()"
      class="w-full mt-4 py-3 px-4 border border-transparent rounded-lg font-medium text-white bg-teal-600 hover:bg-teal-500 focus:outline-none focus:ring-2 focus:ring-teal-500 transition-colors disabled:opacity-50"
    >
      @if (isLoading()) {
        <span>Création en cours...</span>
      } @else {
        <span>Créer l'utilisateur</span>
      }
    </button>
  </form>
</div>
